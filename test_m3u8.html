<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniview m3u8 video</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font: 12px monospace; }
  video { width: 100%; background: #000; }
  #log { padding: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<video id="v" controls playsinline preload="metadata">
  <source src="https://ndtv24x7elemarchana.akamaized.net/hls/live/2003678/ndtv24x7/master.m3u8" type="application/vnd.apple.mpegurl">
</video>
<div id="log"></div>
<script>
  var v = document.getElementById('v');
  var logEl = document.getElementById('log');
  ['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'waiting', 'stalled', 'error']
    .forEach(function (name) {
      v.addEventListener(name, function () {
        var t = new Date().toISOString().substr(11, 12);
        var extra = (name === 'error' && v.error) ? ' code=' + v.error.code : '';
        logEl.textContent += t + ' ' + name + ' paused=' + v.paused + ' ready=' + v.readyState + extra + '\n';
      });
    });
</script>
</body>
</html>
