<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniview m3u8 video</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font: 12px monospace; }
  video { width: 100%; background: #000; }
  .bar { padding: 8px; }
  button { margin-right: 8px; padding: 6px 10px; }
  #log { padding: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<!-- 默认带 autoplay: 模拟 MediaDocument 的 <video controls autoplay>, 用来测宿主能否拦 -->
<video id="v" controls playsinline autoplay preload="metadata">
  <source src="https://ndtv24x7elemarchana.akamaized.net/hls/live/2003678/ndtv24x7/master.m3u8" type="application/vnd.apple.mpegurl">
</video>
<div class="bar">
  <button id="btnRemove">取消 autoplay</button>
  <button id="btnReload">重新加载(load)</button>
  <span id="state"></span>
</div>
<div id="log"></div>
<script>
  var v = document.getElementById('v');
  var logEl = document.getElementById('log');
  var stateEl = document.getElementById('state');

  function now() { return new Date().toISOString().substr(11, 12); }
  function show() { stateEl.textContent = 'autoplay=' + v.autoplay; }
  function log(s) { logEl.textContent += now() + ' ' + s + '\n'; }

  ['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'waiting', 'stalled', 'error']
    .forEach(function (name) {
      v.addEventListener(name, function () {
        var extra = (name === 'error' && v.error) ? ' code=' + v.error.code : '';
        log(name + ' paused=' + v.paused + ' ready=' + v.readyState +
            ' net=' + v.networkState + ' t=' + v.currentTime.toFixed(2) + extra);
      });
    });

  document.getElementById('btnRemove').onclick = function () {
    v.removeAttribute('autoplay');
    v.autoplay = false;
    show();
    log('removed autoplay attribute, autoplay=' + v.autoplay);
  };
  document.getElementById('btnReload').onclick = function () {
    log('call load()');
    v.load();
  };

  show();
  log('page ready, autoplay=' + v.autoplay);
</script>
</body>
</html>
