<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>HLS live: play() after preload</title>
<video id="v" width="320" muted playsinline preload="auto" controls>
  <source src="live.m3u8" type="application/vnd.apple.mpegurl">
</video>
<pre id="log"></pre>
<script>
const v = document.getElementById('v'), log = document.getElementById('log');
const t0 = performance.now();
const out = s => log.textContent += `${((performance.now() - t0) / 1000).toFixed(1)}s ${s}\n`;
['loadstart', 'loadedmetadata', 'canplay', 'playing', 'pause', 'waiting', 'error', 'emptied']
  .forEach(e => v.addEventListener(e, () =>
    out(e + (e === 'error' ? ' ' + JSON.stringify(v.error && {code: v.error.code, message: v.error.message}) : ''))));
setTimeout(() => { out('call play()'); v.play().catch(e => out('play() rejected: ' + e.name)); }, 8000);
setTimeout(() => out(`result: error=${v.error ? v.error.code : null} paused=${v.paused} currentTime=${v.currentTime.toFixed(2)}`), 12000);
</script>
